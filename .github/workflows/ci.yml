name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # Pinned: ubuntu-latest moved to Ubuntu 26.04 (Oct 2026), which has no
    # Python 3.9 build for actions/setup-python; 24.04 has 3.9, 3.11 and 3.12.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
      - name: Smoke test
        run: python -m miccmac assess ci-runner --format json
      - name: Unit tests
        run: pytest -q
