# Example configuration for `miccmac assess --config`.
#
# excluded_checks: built-in check ids to exclude from scoring, each with a
#   required, recorded reason. Excluded checks are never silently dropped --
#   they still appear in the report as NOT_APPLICABLE with
#   "Excluded: <reason>", just removed from that property's scoring
#   denominator rather than counted as a pass or fail.
excluded_checks:
  - check_id: MON-02
    reason: "No centralized SIEM in this pilot's environment."

# custom_checks_dir: a directory of your own check plugins (see
# custom_checks/acme_extra_checks.py for the interface). Relative paths are
# resolved relative to this config file's own directory.
custom_checks_dir: ./custom_checks
