# MICCMAC Zero Trust Device Readiness -- Control Mappings
#
# Each of the seven MICCMAC properties (Monitored, Inventoried, Controlled,
# Claimed, Minimized, Assessed, Current) is mapped to the recognized control
# frameworks it draws on:
#   - NIST SP 800-207  Zero Trust Architecture (tenets / logical components)
#   - NIST SP 800-53 Rev 5  Security and Privacy Controls
#   - CIS Critical Security Controls v8
#
# This file is the authoritative mapping referenced by the toolkit and by the
# accompanying paper. It is useful as a standalone resource even without the
# Python tooling.
#
# MICCMAC is the set of defensible-system properties described in Richard
# Bejtlich's Defensible Network Architecture 2.0. The Zero Trust extension and
# this mapping are the work of Isaac Ojeh (ECCWS 2025, DOI
# 10.34190/eccws.24.1.3531) and are independent of, and not endorsed by,
# Mr. Bejtlich.

version: "0.2.0"
framework: "MICCMAC Zero Trust Device Readiness"

properties:

  - key: monitored
    letter: M
    title: Monitored
    intent: >
      The device's security-relevant activity is logged, retained, and
      continuously monitored so that compromise can be detected.
    nist_800_207:
      - "Tenet 5: The enterprise monitors and measures the integrity and
         security posture of all owned and associated assets."
      - "Continuous diagnostics and mitigation (CDM) feeds the policy engine."
    nist_800_53:
      - "AU-2  Event Logging"
      - "AU-6  Audit Record Review, Analysis, and Reporting"
      - "SI-4  System Monitoring"
      - "CA-7  Continuous Monitoring"
    cis_v8:
      - "Control 8  Audit Log Management"
      - "Control 13 Network Monitoring and Defense"

  - key: inventoried
    letter: I
    title: Inventoried
    intent: >
      The device is known to the organization and tracked in an authoritative
      hardware and software inventory.
    nist_800_207:
      - "An asset cannot be protected or have policy applied to it unless it is
         identified; resource identification underpins the policy engine."
    nist_800_53:
      - "CM-8  System Component Inventory"
      - "PM-5  System Inventory"
    cis_v8:
      - "Control 1  Inventory and Control of Enterprise Assets"
      - "Control 2  Inventory and Control of Software Assets"

  - key: controlled
    letter: C
    title: Controlled
    intent: >
      Configuration and access to the device are centrally governed by
      enforced policy, not left to local discretion.
    nist_800_207:
      - "Tenet 4: Access to resources is determined by dynamic policy."
      - "Tenet 7: Per-session access; the Policy Enforcement Point governs
         every connection."
    nist_800_53:
      - "AC-3  Access Enforcement"
      - "AC-6  Least Privilege"
      - "CM-2  Baseline Configuration"
      - "CM-6  Configuration Settings"
      - "IA-2  Identification and Authentication (Organizational Users)"
    cis_v8:
      - "Control 4  Secure Configuration of Enterprise Assets and Software"
      - "Control 5  Account Management"
      - "Control 6  Access Control Management"

  - key: claimed
    letter: C
    title: Claimed
    intent: >
      The device has a known, accountable owner and administrator, and a
      documented business purpose and data classification.
    nist_800_207:
      - "Subjects and assets must be identifiable and accountable for trust
         decisions to be meaningful."
    nist_800_53:
      - "CM-8  System Component Inventory (ownership attributes)"
      - "PS-2  Position Risk Designation"
      - "RA-2  Security Categorization"
    cis_v8:
      - "Control 1  Inventory and Control of Enterprise Assets (asset owner)"
      - "Control 3  Data Protection (data classification and ownership)"

  - key: minimized
    letter: M
    title: Minimized
    intent: >
      The device's attack surface is reduced to the minimum required for its
      documented purpose.
    nist_800_207:
      - "Reduce implicit trust zones and minimize the attack surface available
         to an adversary that reaches the asset."
    nist_800_53:
      - "CM-7  Least Functionality"
      - "AC-6  Least Privilege"
      - "SC-7  Boundary Protection"
    cis_v8:
      - "Control 4  Secure Configuration of Enterprise Assets and Software"
      - "Control 12 Network Infrastructure Management"

  - key: assessed
    letter: A
    title: Assessed
    intent: >
      The device is regularly and authoritatively assessed for vulnerabilities
      and configuration weakness.
    nist_800_207:
      - "Continuous diagnostics and mitigation continuously evaluate asset
         posture and feed the policy engine."
    nist_800_53:
      - "RA-5  Vulnerability Monitoring and Scanning"
      - "CA-2  Control Assessments"
      - "CA-7  Continuous Monitoring"
    cis_v8:
      - "Control 7  Continuous Vulnerability Management"

  - key: current
    letter: C
    title: Current
    intent: >
      The device is kept in its most secure state: patched, updated, and free
      of expired cryptographic material.
    nist_800_207:
      - "Assets are kept in their most secure state consistent with their
         function; patching maintains asset trustworthiness."
    nist_800_53:
      - "SI-2   Flaw Remediation"
      - "MA-2   Controlled Maintenance"
      - "SC-12  Cryptographic Key Establishment and Management"
    cis_v8:
      - "Control 7  Continuous Vulnerability Management (remediation)"
      - "Control 4  Secure Configuration of Enterprise Assets and Software"

# Per-check risk enrichment, added in v0.2.0.
#
# cis_ig: the lowest CIS Implementation Group (IG1/IG2/IG3) at which the
#   check's closest CIS v8 Safeguard first appears. IG1 = basic cyber hygiene
#   expected of every organization; IG2 = requires more organizational
#   maturity to operate (centralized tooling, scheduled processes, identity
#   integration). No built-in check is IG3 in this release -- IG3 is reserved
#   for checks a custom plugin might add for organizations facing
#   sophisticated/targeted threats; it is not "missing," it is unexercised by
#   the 26 built-in checks.
#
# fair_frequency / fair_magnitude: a simplified, qualitative LOW/MEDIUM/HIGH
#   rating inspired by FAIR (Factor Analysis of Information Risk), not
#   quantitative FAIR/Monte Carlo, which is out of scope. frequency = how
#   often the underlying failure mode is actually the thing adversaries
#   exploit in the wild; magnitude = the blast radius if it is. Checks tied to
#   top real-world initial-access/lateral-movement vectors (missing EDR,
#   unmanaged endpoint, unrestricted local admin, no host firewall, unpatched
#   OS/software) are HIGH/HIGH. Administrative/record-keeping checks (ownership
#   records, hardware attribute documentation, review cadence) are LOW/LOW.
# These two fields combine into a risk rating via the matrix in
# miccmac/risk_register.py; see docs/methodology.md for the full rationale.
#
# remediation: a short, actionable next step for a FAIL/PARTIAL result on this
#   check, surfaced in the risk register as each entry's "Recommended fix" so
#   the register reads as a prioritized action plan, not just a list of gaps.
checks:
  - { check_id: MON-01, property_key: monitored,   cis_ig: IG1, fair_frequency: HIGH,   fair_magnitude: MEDIUM, remediation: "Enable OS-native security/audit logging (e.g. Windows Event Logging, Linux auditd) on the device and confirm it is actively generating events." }
  - { check_id: MON-02, property_key: monitored,   cis_ig: IG2, fair_frequency: MEDIUM, fair_magnitude: MEDIUM, remediation: "Deploy a log-forwarding agent and point it at the organization's centralized SIEM/log platform so this device's logs are retained off-host." }
  - { check_id: MON-03, property_key: monitored,   cis_ig: IG2, fair_frequency: HIGH,   fair_magnitude: HIGH,   remediation: "Install and start the standard EDR/endpoint telemetry agent for this fleet; confirm the agent service is running and reporting healthy." }
  - { check_id: MON-04, property_key: monitored,   cis_ig: IG2, fair_frequency: MEDIUM, fair_magnitude: MEDIUM, remediation: "Apply the organization's baseline audit policy (or auditd rules) so authentication, privilege-use, and process-creation events are captured." }
  - { check_id: INV-01, property_key: inventoried, cis_ig: IG1, fair_frequency: MEDIUM, fair_magnitude: MEDIUM, remediation: "Register the device in the authoritative CMDB/asset inventory system (or supply it via --inventory-record) so it is tracked as a known asset." }
  - { check_id: INV-02, property_key: inventoried, cis_ig: IG1, fair_frequency: LOW,    fair_magnitude: LOW,    remediation: "Populate hardware make/model/serial (e.g. via DMI/SMBIOS) so osquery's system_info table returns non-empty vendor/model/serial values." }
  - { check_id: INV-03, property_key: inventoried, cis_ig: IG1, fair_frequency: MEDIUM, fair_magnitude: MEDIUM, remediation: "Confirm the device's package manager (apt/dpkg, etc.) is queryable and its installed-software list is being collected into inventory." }
  - { check_id: INV-04, property_key: inventoried, cis_ig: IG2, fair_frequency: LOW,    fair_magnitude: LOW,    remediation: "Re-review and re-date the device's inventory record, and schedule a recurring review so it never again exceeds the policy interval." }
  - { check_id: CTL-01, property_key: controlled,  cis_ig: IG1, fair_frequency: HIGH,   fair_magnitude: HIGH,   remediation: "Enroll the device in the organization's central configuration-management/MDM platform." }
  - { check_id: CTL-02, property_key: controlled,  cis_ig: IG1, fair_frequency: HIGH,   fair_magnitude: HIGH,   remediation: "Remove standing local-administrator rights from routine accounts; grant elevation via a just-in-time/PAM mechanism instead." }
  - { check_id: CTL-03, property_key: controlled,  cis_ig: IG2, fair_frequency: MEDIUM, fair_magnitude: HIGH,   remediation: "Place the device behind an identity-aware proxy or conditional-access policy tied to the organization's IdP." }
  - { check_id: CTL-04, property_key: controlled,  cis_ig: IG2, fair_frequency: MEDIUM, fair_magnitude: MEDIUM, remediation: "Assign the device a configuration baseline (e.g. GPO/Ansible/Intune profile) and enable drift detection/auto-remediation." }
  - { check_id: CLM-01, property_key: claimed,     cis_ig: IG1, fair_frequency: LOW,    fair_magnitude: LOW,    remediation: "Record a named accountable business owner for the device in the asset/inventory system." }
  - { check_id: CLM-02, property_key: claimed,     cis_ig: IG1, fair_frequency: LOW,    fair_magnitude: LOW,    remediation: "Record the responsible system administrator or owning team for the device." }
  - { check_id: CLM-03, property_key: claimed,     cis_ig: IG2, fair_frequency: LOW,    fair_magnitude: MEDIUM, remediation: "Document the device's business purpose and assign it a data classification label." }
  - { check_id: MIN-01, property_key: minimized,   cis_ig: IG2, fair_frequency: MEDIUM, fair_magnitude: MEDIUM, remediation: "Disable and stop any running services/daemons not required for the device's documented purpose." }
  - { check_id: MIN-02, property_key: minimized,   cis_ig: IG1, fair_frequency: MEDIUM, fair_magnitude: MEDIUM, remediation: "Uninstall software packages that are not on the approved/required list for this device's role." }
  - { check_id: MIN-03, property_key: minimized,   cis_ig: IG1, fair_frequency: HIGH,   fair_magnitude: HIGH,   remediation: "Enable the host firewall and stop listening on any network-reachable port not required by an approved service." }
  - { check_id: MIN-04, property_key: minimized,   cis_ig: IG2, fair_frequency: MEDIUM, fair_magnitude: MEDIUM, remediation: "Apply a recognized hardening baseline (e.g. a CIS Benchmark) appropriate to the device's OS." }
  - { check_id: ASM-01, property_key: assessed,    cis_ig: IG2, fair_frequency: MEDIUM, fair_magnitude: MEDIUM, remediation: "Enroll the device in the organization's authenticated vulnerability-scanning schedule." }
  - { check_id: ASM-02, property_key: assessed,    cis_ig: IG2, fair_frequency: LOW,    fair_magnitude: MEDIUM, remediation: "Enroll the device in a recurring configuration/compliance assessment (e.g. CIS-CAT, SCAP)." }
  - { check_id: ASM-03, property_key: assessed,    cis_ig: IG1, fair_frequency: MEDIUM, fair_magnitude: MEDIUM, remediation: "Load this device's open findings into the remediation-tracking system with SLA due dates and named owners." }
  - { check_id: CUR-01, property_key: current,     cis_ig: IG1, fair_frequency: HIGH,   fair_magnitude: HIGH,   remediation: "Apply pending OS security patches and confirm the patch cadence meets policy (e.g. via unattended-upgrades/WSUS)." }
  - { check_id: CUR-02, property_key: current,     cis_ig: IG1, fair_frequency: HIGH,   fair_magnitude: HIGH,   remediation: "Update out-of-date third-party applications and enroll the device in third-party patch management." }
  - { check_id: CUR-03, property_key: current,     cis_ig: IG2, fair_frequency: LOW,    fair_magnitude: MEDIUM, remediation: "Update the device's firmware/BIOS to the vendor's current supported version." }
  - { check_id: CUR-04, property_key: current,     cis_ig: IG2, fair_frequency: MEDIUM, fair_magnitude: MEDIUM, remediation: "Renew or replace any expired/expiring certificates and rotate stale cryptographic material before it lapses." }
